<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Slideshow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;background:#0a0e2a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;}
#stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
#title-bar{font-size:28px;font-weight:700;color:#ff00cc;text-align:center;min-height:36px;letter-spacing:.5px;text-shadow:0 0 18px rgba(255,0,204,0.5);transition:opacity .35s;}
#subtitle{font-size:15px;color:#9080c0;text-align:center;min-height:20px;transition:opacity .35s;}
#board{position:relative;width:min(82vmin,440px);height:min(82vmin,440px);background:#0d1133;border:1px solid #2a0a4a;border-radius:18px;padding:10px;box-shadow:0 0 60px rgba(204,0,170,0.18);}
#cells{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;}
.cell{background:#151840;border-radius:6px;}
#tiles{position:absolute;inset:10px;}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;will-change:left,top;transition:left .28s cubic-bezier(.25,.8,.4,1),top .28s cubic-bezier(.25,.8,.4,1),opacity .25s ease,background .25s ease,color .25s ease;transform:translateZ(0);box-shadow:0 2px 6px rgba(0,0,0,0.25);backface-visibility:hidden;}
.tile.spawning{animation:spawn .25s ease forwards;}
.tile.merging{animation:mpop .28s ease forwards;}
.tile.win{animation:winpulse 1.4s ease-in-out infinite;will-change:transform,filter;}
@keyframes spawn{0%{transform:translateZ(0) scale(0);opacity:0}100%{transform:translateZ(0) scale(1);opacity:1}}
@keyframes mpop{0%{transform:translateZ(0) scale(1)}50%{transform:translateZ(0) scale(1.22)}100%{transform:translateZ(0) scale(1)}}
@keyframes winpulse{0%,100%{transform:translateZ(0) scale(1);filter:drop-shadow(0 0 12px rgba(255,68,221,0.6))}50%{transform:translateZ(0) scale(1.06);filter:drop-shadow(0 0 22px rgba(255,68,221,0.95))}}
#overlay{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,14,42,0.0);pointer-events:none;opacity:0;transition:opacity .4s,background .4s;z-index:10;}
#overlay.show{opacity:1;background:rgba(10,14,42,0.88);}
#overlay-msg{font-size:42px;font-weight:800;color:#ff44dd;text-shadow:0 0 30px rgba(255,68,221,0.8);}
#overlay-sub{font-size:18px;color:#cc88ff;}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:18px;}
.conf{position:absolute;top:-12px;width:8px;height:8px;border-radius:2px;will-change:transform,opacity;animation:confetti-fall var(--dur,2.4s) cubic-bezier(.25,.8,.4,1) forwards;transform:translate3d(0,0,0) rotate(0);}
@keyframes confetti-fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot));opacity:0}}
#progress{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:#2a1a4a;transition:background .3s,width .3s;}
.dot.active{background:#ff00cc;width:22px;border-radius:4px;}
#arrow-hint{position:absolute;font-size:48px;color:#ff00cc;opacity:0;pointer-events:none;text-shadow:0 0 18px rgba(255,0,204,0.7);transition:opacity .3s;z-index:5;}
#arrow-hint.show{opacity:0.95;}
#brand{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;}
.lg{position:relative;width:30px;height:30px;}
.lg1,.lg2{position:absolute;width:20px;height:20px;border-radius:5px;}
.lg1{background:#cc00aa;opacity:0.7;top:8px;left:8px;}
.lg2{background:#ff00cc;top:2px;left:2px;}
.brand-t{font-size:24px;font-weight:700;color:#ff00cc;}
#start-screen{position:fixed;inset:0;background:rgba(10,14,42,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:200;transition:opacity .4s;}
#start-screen.hide{opacity:0;pointer-events:none;}
#start-title{font-size:56px;font-weight:800;color:#ff00cc;text-shadow:0 0 30px rgba(255,0,204,0.6);}
#start-sub{font-size:16px;color:#cc88ff;text-align:center;max-width:80%;line-height:1.5;}
#start-status{font-size:13px;color:#7060a0;text-align:center;min-height:18px;}
#start-btn{padding:18px 44px;font-size:22px;font-weight:700;background:#cc00aa;color:#fff;border:none;border-radius:14px;cursor:pointer;font-family:inherit;box-shadow:0 6px 30px rgba(204,0,170,0.5);transition:transform .15s,opacity .2s;}
#start-btn:disabled{opacity:0.5;cursor:wait;}
#start-btn:not(:disabled):active{transform:scale(0.96);}
#audio-time{position:fixed;bottom:18px;right:20px;font-size:11px;color:#7060a0;background:#12163a;border:1px solid #2a1a4a;padding:5px 10px;border-radius:14px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="start-screen">
  <div id="start-title">2048</div>
  <div id="start-sub">Հայերեն ուսուցողական ցուցադրում<br><span style="color:#9080c0;font-size:14px;">Туториал с армянским озвучиванием</span></div>
  <button id="start-btn" disabled>⏳ Загрузка…</button>
  <div id="start-status">Анализ аудио…</div>
</div>
<audio id="narration" preload="auto" src="audio/narration.m4a"></audio>
<div id="audio-time">0:00</div>
<div id="brand"><div class="lg"><div class="lg1"></div><div class="lg2"></div></div><div class="brand-t">2048</div></div>
<div id="stage">
  <div id="title-bar">Игра 2048</div>
  <div id="subtitle">Соединяй плитки и доберись до 2048</div>
  <div id="board">
    <div id="cells"></div>
    <div id="tiles"></div>
    <div id="arrow-hint">→</div>
    <div id="confetti"></div>
    <div id="overlay">
      <div id="overlay-msg">ПОБЕДА!</div>
      <div id="overlay-sub">Ты собрал 2048 🎉</div>
    </div>
  </div>
</div>
<div id="progress"></div>

<script>
(function(){
'use strict';

var TC = {
  2:{bg:'#1a0d3a',fg:'#cc88ff'},
  4:{bg:'#220d44',fg:'#dd99ff'},
  8:{bg:'#4a006a',fg:'#ffaaff'},
  16:{bg:'#660080',fg:'#ffccff'},
  32:{bg:'#880099',fg:'#fff'},
  64:{bg:'#aa00bb',fg:'#fff'},
  128:{bg:'#cc00aa',fg:'#fff'},
  256:{bg:'#dd0099',fg:'#fff'},
  512:{bg:'#ee0088',fg:'#fff'},
  1024:{bg:'#ff00cc',fg:'#fff'},
  2048:{bg:'#ff44dd',fg:'#0a0e2a'}
};

var cellsEl = document.getElementById('cells');
var tilesEl = document.getElementById('tiles');
var titleEl = document.getElementById('title-bar');
var subEl = document.getElementById('subtitle');
var overlayEl = document.getElementById('overlay');
var overlayMsg = document.getElementById('overlay-msg');
var overlaySub = document.getElementById('overlay-sub');
var arrowEl = document.getElementById('arrow-hint');
var progressEl = document.getElementById('progress');
var confettiEl = document.getElementById('confetti');
var boardEl = document.getElementById('board');

// Build 4x4 grid background
for(var i=0;i<16;i++){
  var c = document.createElement('div');
  c.className = 'cell';
  cellsEl.appendChild(c);
}

function boardSize(){
  var rect = tilesEl.getBoundingClientRect();
  return {w:rect.width, h:rect.height};
}

function tilePos(r,c){
  var sz = boardSize();
  var gap = 8;
  var cell = (sz.w - gap*3) / 4;
  return {
    left: c * (cell + gap),
    top:  r * (cell + gap),
    size: cell
  };
}

function fontSize(val, size){
  if(val < 100) return Math.floor(size*0.5);
  if(val < 1000) return Math.floor(size*0.42);
  return Math.floor(size*0.32);
}

// Tile manager: id -> element
var tiles = {};
var nextId = 1;

function createTile(r, c, val, opts){
  opts = opts || {};
  var id = nextId++;
  var p = tilePos(r,c);
  var col = TC[val] || {bg:'#333',fg:'#fff'};
  var el = document.createElement('div');
  el.className = 'tile' + (opts.spawn ? ' spawning' : '');
  el.style.width = p.size + 'px';
  el.style.height = p.size + 'px';
  el.style.left = p.left + 'px';
  el.style.top = p.top + 'px';
  el.style.background = col.bg;
  el.style.color = col.fg;
  el.style.fontSize = fontSize(val, p.size) + 'px';
  el.textContent = val;
  tilesEl.appendChild(el);
  tiles[id] = {el:el, r:r, c:c, val:val};
  return id;
}

function moveTile(id, r, c){
  var t = tiles[id];
  if(!t) return;
  var p = tilePos(r, c);
  t.r = r; t.c = c;
  t.el.style.left = p.left + 'px';
  t.el.style.top = p.top + 'px';
}

function setTileValue(id, val, doMergePop){
  var t = tiles[id];
  if(!t) return;
  var col = TC[val] || {bg:'#333',fg:'#fff'};
  var p = tilePos(t.r, t.c);
  t.val = val;
  t.el.textContent = val;
  t.el.style.background = col.bg;
  t.el.style.color = col.fg;
  t.el.style.fontSize = fontSize(val, p.size) + 'px';
  if(doMergePop){
    t.el.classList.remove('merging');
    void t.el.offsetWidth;
    t.el.classList.add('merging');
  }
}

function removeTile(id){
  var t = tiles[id];
  if(!t) return;
  t.el.style.opacity = '0';
  setTimeout(function(){
    if(t.el.parentNode) t.el.parentNode.removeChild(t.el);
  }, 220);
  delete tiles[id];
}

function clearBoard(){
  Object.keys(tiles).forEach(function(id){
    var t = tiles[id];
    if(t.el.parentNode) t.el.parentNode.removeChild(t.el);
  });
  tiles = {};
}

function setText(title, sub){
  titleEl.style.opacity = '0';
  subEl.style.opacity = '0';
  setTimeout(function(){
    titleEl.textContent = title;
    subEl.textContent = sub;
    titleEl.style.opacity = '1';
    subEl.style.opacity = '1';
  }, 350);
}

function showArrow(dir){
  var map = {left:'←', right:'→', up:'↑', down:'↓'};
  arrowEl.textContent = map[dir] || '';
  // Position center of board
  arrowEl.style.left = '50%';
  arrowEl.style.top = '50%';
  arrowEl.style.transform = 'translate(-50%,-50%)';
  arrowEl.classList.add('show');
}
function hideArrow(){ arrowEl.classList.remove('show'); }

function showOverlay(msg, sub){
  overlayMsg.textContent = msg;
  overlaySub.textContent = sub;
  overlayEl.classList.add('show');
}
function hideOverlay(){ overlayEl.classList.remove('show'); }

function spawnConfetti(){
  var colors = ['#ff00cc','#ff44dd','#cc00aa','#ffaaff','#ffccff','#88ddff'];
  var frag = document.createDocumentFragment();
  var n = 36;
  for(var i=0;i<n;i++){
    var p = document.createElement('div');
    p.className = 'conf';
    p.style.background = colors[i % colors.length];
    p.style.left = (Math.random()*100) + '%';
    p.style.setProperty('--dx', ((Math.random()-0.5)*220) + 'px');
    p.style.setProperty('--dy', (260 + Math.random()*200) + 'px');
    p.style.setProperty('--rot', ((Math.random()-0.5)*720) + 'deg');
    p.style.setProperty('--dur', (1.6 + Math.random()*1.4) + 's');
    p.style.animationDelay = (Math.random()*0.25) + 's';
    p.addEventListener('animationend', function(e){
      if(e.target.parentNode) e.target.parentNode.removeChild(e.target);
    }, {once:true});
    frag.appendChild(p);
  }
  confettiEl.appendChild(frag);
}

function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

// Slide generation token — prevents stale slide animations from continuing after a new slide starts.
// Each slide captures slideGen at start; if it changes, the slide aborts.
var slideGen = 0;
function alive(myGen){ return myGen === slideGen; }

// ===== Slides =====
var slides = [];

// Slide 1: intro
slides.push(async function(g){
  setText('Игра 2048', 'Знакомство с плитками');
  await sleep(450); if(!alive(g)) return;
  var layout = [[0,0,2],[0,2,4],[1,1,8],[1,3,2],[2,0,16],[2,3,4],[3,1,32],[3,2,2]];
  for(var i=0;i<layout.length;i++){
    if(!alive(g)) return;
    createTile(layout[i][0], layout[i][1], layout[i][2], {spawn:true});
    await sleep(120);
  }
});

// Slide 2: 2 + 2 = 4
slides.push(async function(g){
  setText('2 + 2 = 4', 'Две одинаковые плитки сливаются');
  clearBoard();
  await sleep(600); if(!alive(g)) return;
  var a = createTile(1, 0, 2, {spawn:true});
  var b = createTile(1, 3, 2, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('right');
  await sleep(400); if(!alive(g)) return;
  hideArrow();
  moveTile(a, 1, 2);
  await sleep(140); if(!alive(g)) return;
  moveTile(a, 1, 3);
  await sleep(280);
  setTileValue(b, 4, true);
  removeTile(a);
  await sleep(1500);
});

// Slide 3: 4 + 4 = 8
slides.push(async function(g){
  setText('4 + 4 = 8', 'Сливаем дальше');
  clearBoard();
  await sleep(600); if(!alive(g)) return;
  var a = createTile(1, 0, 4, {spawn:true});
  var b = createTile(1, 3, 4, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('right');
  await sleep(400); if(!alive(g)) return;
  hideArrow();
  moveTile(a, 1, 2);
  await sleep(140); if(!alive(g)) return;
  moveTile(a, 1, 3);
  await sleep(280); if(!alive(g)) return;
  setTileValue(b, 8, true);
  removeTile(a);
});

// Slide 4: LEFT
slides.push(async function(g){
  setText('Свайп ВЛЕВО', 'Все плитки скользят влево');
  clearBoard();
  await sleep(500); if(!alive(g)) return;
  var t1 = createTile(0, 3, 2, {spawn:true});
  var t2 = createTile(1, 2, 4, {spawn:true});
  var t3 = createTile(2, 1, 8, {spawn:true});
  var t4 = createTile(3, 3, 16, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('left');
  await sleep(450); if(!alive(g)) return;
  hideArrow();
  moveTile(t1, 0, 0); moveTile(t2, 1, 0); moveTile(t3, 2, 0); moveTile(t4, 3, 0);
});

// Slide 5: RIGHT
slides.push(async function(g){
  setText('Свайп ВПРАВО', 'Все плитки скользят вправо');
  clearBoard();
  await sleep(500); if(!alive(g)) return;
  var t1 = createTile(0, 0, 2, {spawn:true});
  var t2 = createTile(1, 1, 4, {spawn:true});
  var t3 = createTile(2, 2, 8, {spawn:true});
  var t4 = createTile(3, 0, 16, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('right');
  await sleep(450); if(!alive(g)) return;
  hideArrow();
  moveTile(t1, 0, 3); moveTile(t2, 1, 3); moveTile(t3, 2, 3); moveTile(t4, 3, 3);
});

// Slide 6: UP
slides.push(async function(g){
  setText('Свайп ВВЕРХ', 'Все плитки летят вверх');
  clearBoard();
  await sleep(500); if(!alive(g)) return;
  var t1 = createTile(3, 0, 2, {spawn:true});
  var t2 = createTile(2, 1, 4, {spawn:true});
  var t3 = createTile(3, 2, 8, {spawn:true});
  var t4 = createTile(2, 3, 16, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('up');
  await sleep(450); if(!alive(g)) return;
  hideArrow();
  moveTile(t1, 0, 0); moveTile(t2, 0, 1); moveTile(t3, 0, 2); moveTile(t4, 0, 3);
});

// Slide 7: DOWN
slides.push(async function(g){
  setText('Свайп ВНИЗ', 'Все плитки падают вниз');
  clearBoard();
  await sleep(500); if(!alive(g)) return;
  var t1 = createTile(0, 0, 2, {spawn:true});
  var t2 = createTile(1, 1, 4, {spawn:true});
  var t3 = createTile(0, 2, 8, {spawn:true});
  var t4 = createTile(1, 3, 16, {spawn:true});
  await sleep(900); if(!alive(g)) return;
  showArrow('down');
  await sleep(450); if(!alive(g)) return;
  hideArrow();
  moveTile(t1, 3, 0); moveTile(t2, 3, 1); moveTile(t3, 3, 2); moveTile(t4, 3, 3);
});

// Slide 8: build-up to win
slides.push(async function(g){
  setText('Финальная стадия', 'Собираем поле к 2048');
  clearBoard();
  await sleep(500); if(!alive(g)) return;
  var board = [
    [0,0,1024],[0,1,512],[0,2,256],[0,3,128],
    [1,0,64],[1,1,32],[1,2,16],[1,3,8],
    [2,0,4],[2,1,2]
  ];
  for(var i=0;i<board.length;i++){
    if(!alive(g)) return;
    createTile(board[i][0], board[i][1], board[i][2], {spawn:true});
    await sleep(120);
  }
});

// Slide 9: 1024 + 1024 = 2048 — final
slides.push(async function(g){
  setText('1024 + 1024 = 2048', 'Главный момент!');
  clearBoard();
  await sleep(600); if(!alive(g)) return;
  var a = createTile(1, 0, 1024, {spawn:true});
  var b = createTile(1, 3, 1024, {spawn:true});
  await sleep(1200); if(!alive(g)) return;
  showArrow('right');
  await sleep(500); if(!alive(g)) return;
  hideArrow();
  moveTile(a, 1, 1);
  await sleep(160); if(!alive(g)) return;
  moveTile(a, 1, 2);
  await sleep(160); if(!alive(g)) return;
  moveTile(a, 1, 3);
  await sleep(320); if(!alive(g)) return;
  setTileValue(b, 2048, true);
  removeTile(a);
  if(tiles[b]) tiles[b].el.classList.add('win');
  await sleep(700); if(!alive(g)) return;
  spawnConfetti();
  showOverlay('Հաղթանակ! 🎉', '2048');
});

// Build progress dots
for(var s=0;s<slides.length;s++){
  var d = document.createElement('div');
  d.className = 'dot';
  progressEl.appendChild(d);
}
var dots = progressEl.querySelectorAll('.dot');

function setActiveDot(idx){
  for(var i=0;i<dots.length;i++){
    dots[i].classList.toggle('active', i===idx);
  }
}

// ===== Audio-driven slide controller =====
var audioEl = document.getElementById('narration');
var startBtn = document.getElementById('start-btn');
var startScreen = document.getElementById('start-screen');
var startStatus = document.getElementById('start-status');
var audioTimeEl = document.getElementById('audio-time');

// Hand-calibrated boundaries for this specific narration file (38.16s).
// Numbers below are tested against the audio's actual silence pattern.
// Use null to force auto-detection.
var MANUAL_BOUNDARIES = [5.00, 8.14, 11.15, 14.73, 18.33, 21.88, 25.70, 31.04];

var boundaries = null;       // [t1, t2, ..., t8]  -- entry times for slides 1..8 (slide 0 starts at 0)
var slideStartTimes = null;  // [0, t1, t2, ..., t8] -- entry time for each slide 0..8
var currentSlideIdx = -1;
var audioReady = false;

function fmtTime(s){
  if(!isFinite(s)) return '0:00';
  var m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ':' + (r<10?'0':'') + r;
}

// Decode audio and find silence boundaries
async function detectBoundaries(){
  startStatus.textContent = 'Загружаю аудио…';
  var resp = await fetch('audio/narration.m4a');
  if(!resp.ok) throw new Error('Не удалось загрузить аудио ('+resp.status+')');
  var arrBuf = await resp.arrayBuffer();
  startStatus.textContent = 'Декодирую…';
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = new AC();
  var buf = await new Promise(function(res, rej){
    ctx.decodeAudioData(arrBuf.slice(0), res, rej);
  });
  startStatus.textContent = 'Анализирую паузы…';

  // Mix to mono if needed
  var ch0 = buf.getChannelData(0);
  var data;
  if(buf.numberOfChannels > 1){
    var ch1 = buf.getChannelData(1);
    data = new Float32Array(ch0.length);
    for(var i=0;i<ch0.length;i++) data[i] = (ch0[i] + ch1[i]) * 0.5;
  } else {
    data = ch0;
  }

  var sr = buf.sampleRate;
  var duration = buf.duration;

  // Compute RMS over 30ms windows
  var winMs = 30;
  var winSize = Math.floor(sr * winMs / 1000);
  var nWin = Math.floor(data.length / winSize);
  var rms = new Float32Array(nWin);
  var peak = 0;
  for(var w=0; w<nWin; w++){
    var s=0, off=w*winSize;
    for(var j=0;j<winSize;j++){ var v=data[off+j]; s += v*v; }
    var r = Math.sqrt(s/winSize);
    rms[w] = r;
    if(r>peak) peak = r;
  }
  // Threshold: a fraction of peak, or absolute floor
  var thresh = Math.max(peak * 0.06, 0.01);

  // Find silence gaps >= 350ms
  var minSilenceWin = Math.ceil(350 / winMs);
  var gaps = []; // {start, end, mid}
  var inSilence = false, silStart = 0;
  for(var k=0;k<nWin;k++){
    if(rms[k] < thresh){
      if(!inSilence){ inSilence = true; silStart = k; }
    } else {
      if(inSilence){
        var len = k - silStart;
        if(len >= minSilenceWin){
          var startSec = silStart * winMs / 1000;
          var endSec = k * winMs / 1000;
          gaps.push({start: startSec, end: endSec, mid: (startSec+endSec)/2, len: endSec-startSec});
        }
        inSilence = false;
      }
    }
  }

  // First gap might be leading silence (before speech starts) — skip it if it starts at 0
  // We need 8 boundaries between 9 blocks
  var bdr = gaps.map(function(g){ return g.mid; });

  // If first detected silence is at the very start (leading silence), drop it
  if(gaps.length && gaps[0].start < 0.3){
    bdr.shift();
  }
  // Drop trailing silence (after last block)
  if(gaps.length && bdr.length){
    var lastGap = gaps[gaps.length-1];
    if(lastGap.end > duration - 0.3){
      bdr.pop();
    }
  }

  // We expect 8 boundaries. If we have more, pick the 8 longest gaps. If fewer, fall back.
  if(bdr.length > 8){
    // Pick 8 longest gaps from full gaps array (excluding leading/trailing already removed)
    var workingGaps = gaps.slice();
    if(gaps.length && gaps[0].start < 0.3) workingGaps.shift();
    if(workingGaps.length && workingGaps[workingGaps.length-1].end > duration - 0.3) workingGaps.pop();
    workingGaps.sort(function(a,b){ return b.len - a.len; });
    var top = workingGaps.slice(0, 8);
    top.sort(function(a,b){ return a.mid - b.mid; });
    bdr = top.map(function(g){ return g.mid; });
  }

  if(bdr.length !== 8){
    // Fallback: distribute evenly
    console.warn('Found '+bdr.length+' boundaries, expected 8. Using even distribution.');
    bdr = [];
    for(var p=1; p<=8; p++) bdr.push(duration * p / 9);
  }

  console.log('Detected boundaries:', bdr.map(function(t){ return t.toFixed(2); }));
  console.log('Audio duration:', duration.toFixed(2));

  ctx.close();
  return {boundaries: bdr, duration: duration};
}

function findSlideForTime(t){
  for(var i=slideStartTimes.length-1; i>=0; i--){
    if(t >= slideStartTimes[i]) return i;
  }
  return 0;
}

function gotoSlide(i){
  if(i === currentSlideIdx) return;
  currentSlideIdx = i;
  slideGen++;
  var myGen = slideGen;
  setActiveDot(i);
  hideOverlay();
  hideArrow();
  try { slides[i](myGen); } catch(e){ console.error(e); }
}

function startTimeUpdater(){
  audioEl.addEventListener('timeupdate', function(){
    var t = audioEl.currentTime;
    audioTimeEl.textContent = fmtTime(t) + ' / ' + fmtTime(audioEl.duration||0);
    var idx = findSlideForTime(t);
    if(idx !== currentSlideIdx) gotoSlide(idx);
  });
  audioEl.addEventListener('ended', function(){
    audioTimeEl.textContent = '✓ ' + fmtTime(audioEl.duration||0);
  });
}

async function prepare(){
  // Use manual boundaries if specified — most reliable
  if(MANUAL_BOUNDARIES && MANUAL_BOUNDARIES.length === 8){
    boundaries = MANUAL_BOUNDARIES.slice();
    slideStartTimes = [0].concat(boundaries);
    audioReady = true;
    // Wait for audio metadata for nice display
    if(audioEl.readyState >= 1){
      startStatus.textContent = '✓ ' + fmtTime(audioEl.duration||0) + ' · ручная синхронизация';
    } else {
      startStatus.textContent = '✓ Ручная синхронизация';
      audioEl.addEventListener('loadedmetadata', function(){
        startStatus.textContent = '✓ ' + fmtTime(audioEl.duration||0) + ' · ручная синхронизация';
      });
    }
    startBtn.disabled = false;
    startBtn.textContent = '▶ Старт';
    return;
  }
  try {
    var info = await detectBoundaries();
    boundaries = info.boundaries;
    slideStartTimes = [0].concat(boundaries);
    audioReady = true;
    startStatus.textContent = '✓ Готово · ' + fmtTime(info.duration) + ' · 8 пауз найдено';
    startBtn.disabled = false;
    startBtn.textContent = '▶ Старт';
  } catch(e){
    console.error(e);
    startStatus.textContent = '⚠ ' + e.message;
    startBtn.disabled = false;
    startBtn.textContent = '▶ Старт (без синхронизации)';
    audioEl.addEventListener('loadedmetadata', function(){
      var d = audioEl.duration || 50;
      boundaries = [];
      for(var p=1;p<=8;p++) boundaries.push(d*p/9);
      slideStartTimes = [0].concat(boundaries);
      audioReady = true;
    });
  }
}

startBtn.addEventListener('click', function(){
  if(startBtn.disabled) return;
  startBtn.disabled = true;
  startScreen.classList.add('hide');
  setTimeout(function(){ startScreen.style.display = 'none'; }, 500);
  startTimeUpdater();
  // Force first slide setup
  gotoSlide(0);
  audioEl.play().catch(function(err){
    console.error('Audio play failed:', err);
  });
});

// Boot
window.addEventListener('load', function(){
  prepare();
});

// Re-position tiles on resize
window.addEventListener('resize', function(){
  Object.keys(tiles).forEach(function(id){
    var t = tiles[id];
    var p = tilePos(t.r, t.c);
    t.el.style.width = p.size + 'px';
    t.el.style.height = p.size + 'px';
    t.el.style.left = p.left + 'px';
    t.el.style.top = p.top + 'px';
    t.el.style.fontSize = fontSize(t.val, p.size) + 'px';
  });
});

})();
</script>
